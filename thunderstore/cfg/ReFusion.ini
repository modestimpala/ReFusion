; ReFusion settings.

; Mods whose datatables were built against a different version of the game are
; left out of the merge, because their items would load with no name, icon or
; mesh. Member tags whose GUID merely drifted are remapped automatically, so
; this only covers mods a remap cannot save. List pak names here (as they appear
; in refusion-log.txt) to merge them anyway; "all" takes every one.
;
; Example: merge_incompatible=SomeMod, AnotherMod

merge_incompatible=
