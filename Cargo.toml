[package]
name = "fusion_wrapper"
version = "0.1.0"
edition = "2021"

[lib]
name = "ue4ss"
crate-type = ["cdylib"]

[dependencies]
repak = { path = "../repak/repak", default-features = false, features = ["compression", "oodle"] }
unreal_asset = "0.1"
widestring = "1"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
anyhow = "1"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
]

[build-dependencies]
goblin = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
